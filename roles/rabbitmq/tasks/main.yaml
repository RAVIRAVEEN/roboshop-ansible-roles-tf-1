   - name: install rabbitmq
     ansible.builtin.package:
      name: rabbitmq-server
      state: present
    
     
   - name: start and enable rabbitmq-server 
     ansible.builtin.service:
        name: rabbitmq-server 
        state: started
        enabled: yes 

   - name: install mysql python libraries
     ansible.builtin.pip:
      executable: pip3.9
      name: "{{ item }}"
     loop:
        - botocore
        - boto3    

