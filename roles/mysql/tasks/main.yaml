  - name: install mysql server
    ansible.builtin.package:
     name: mysql-server
     state: present

  - name: start and enable mysql
    ansible.builtin.service:
     name: mysqld
     state: started
     enabled: yes

  - name: install mysql python libraries
    ansible.builtin.pip:
      executable: pip3.9
      name: "{{ item }}"
    loop:
      - botocore
      - boto3


   
  - name: setup root password
    ansible.builtin.command: "mysql_secure_installation --set-root-pass  {{ lookup('amazon.aws.aws_ssm', '/roboshop/{{ env }}/mysql_root_password', decrypt=True, region='us-east-1' ) }}"

   # command: mysql_secure_installation --set-root-pass "{{ mysql_root_pass }}"